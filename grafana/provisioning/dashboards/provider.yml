# load every dashboard json in /var/lib/grafana/dashboards (./grafana/dashboards) on start
apiVersion: 1

providers:
  - name: fertilizer_demo
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
